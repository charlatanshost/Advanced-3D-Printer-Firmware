[package]
name = "printer-firmware"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m-rt = "0.7"
embassy-sync = { version = "0.7.1", default-features = false, features = ["defmt"] }
embassy-time = { version = "0.3.2", default-features = false, features = ["tick-hz-1_000_000"] }
embedded-hal = "1.0"
rp2040-hal = { version = "0.11.0", optional = true }
embassy-rp = { version = "0.2.0", optional = true, default-features = false, features = ["time-driver"] }
panic-halt = "0.2.0"
heapless = { version = "0.8", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = "1.0"

[features]
rp2040 = ["rp2040-hal", "embassy-rp"]